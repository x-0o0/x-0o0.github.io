<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>페이지를 찾을 수 없어요</title>
<script>
  // /casebook-legal로 시작하는 옛 주소를 새 주소의 같은 경로로 넘긴다. 검색어와 #앵커도 그대로 넘긴다.
  (function () {
    var p = location.pathname;
    if (p === '/casebook-legal' || p.indexOf('/casebook-legal/') === 0) {
      location.replace('https://casebook.whitemason.club' + (p.slice('/casebook-legal'.length) || '/') + location.search + location.hash);
    }
  })();
</script>
</head>
<body>
<p>페이지를 찾을 수 없어요. Casebook 문서 사이트는 <a href="https://casebook.whitemason.club/">https://casebook.whitemason.club</a> 에 있어요.</p>
</body>
</html>
